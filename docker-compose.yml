services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://payload:payload@postgres:5432/payload
      PAYLOAD_SECRET: 7ba1dc90f26f7e11a4f48c77
      NODE_ENV: development

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    volumes:
      - pg:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: "pg_isready -U payload -d payload"
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: none

volumes:
  pg:
  node_modules:
